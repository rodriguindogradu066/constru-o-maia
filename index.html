<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
:root{--ff:"Bricolage Grotesque",system-ui,sans-serif;--or:#F07819;--or2:#a14a08;--gr:#242629;--bk:#111;--bg:#f2f2f3;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ok:#17804a;--bad:#c62828;--bd:#e3e3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--ff)}
body,button,input,select,textarea{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{padding-bottom:76px}
header{position:sticky;top:0;z-index:20;background:var(--gr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:3px solid var(--or)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:8px}
.brand b{font-weight:900;letter-spacing:.5px}.brand span{color:var(--or);font-weight:900}
.brand small{display:block;color:#aaa;font-size:11px}
main{max-width:900px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font:600 11px var(--ff);color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--or)}
nav button.sell.orc i{background:var(--gr);box-shadow:0 4px 12px rgba(36,38,41,.4)}
nav button.sell.orc.on{color:var(--gr)}
nav button.sell i{background:var(--or);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 12px rgba(240,120,25,.45);font-size:22px}
h2{font-size:18px;margin:6px 0 10px}
h3{font-size:15px;margin:14px 0 8px}
.card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:10px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kpi small{color:var(--mu);font-size:12px;font-weight:600}.kpi b{display:block;font-size:19px;margin-top:2px}
.kpi.hl{background:var(--gr);color:#fff}.kpi.hl small{color:#bbb}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mu{color:var(--mu);font-size:14px}
.btn{background:var(--or);color:#111;min-height:44px;white-space:nowrap;border:0;border-radius:10px;padding:11px 14px;font:700 14px var(--ff);cursor:pointer}
.btn:active{background:var(--or2)}
.btn.dark{background:var(--gr);color:#fff}.btn.light{background:#e9e9ec;color:var(--tx)}.btn.red{background:var(--bad);color:#fff}.btn.green{background:var(--ok);color:#fff}
.btn.big{width:100%;padding:15px;font-size:16px}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:8px;min-height:40px}
.ghost{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;min-width:44px;min-height:44px}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;font:15px var(--ff);background:#fff;color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--or);border-color:transparent}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:10px 14px;font:600 14px var(--ff);cursor:pointer;color:var(--tx)}
.chip.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.list .it:last-child{border-bottom:0}

.badge.low{background:#fde3e3;color:var(--bad)}.badge.okb{background:#dff5e8;color:var(--ok)}.badge.or{background:#fdebdc;color:var(--or2)}
.cart .ci{border-bottom:1px solid var(--bd);padding:10px 0}
.qty{display:flex;align-items:center;gap:6px}

.qty input{width:64px;text-align:center;padding:10px}
.pays{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pays button{border:2px solid var(--bd);background:#fff;border-radius:10px;padding:12px 2px;min-height:48px;font:700 13px var(--ff);cursor:pointer;color:var(--tx)}
.pays button.on{border-color:var(--or);background:#fff4ec;color:var(--or2)}
.total{font-size:26px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}

@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:16px}}
.scan{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
#reader{flex:1;width:100%;overflow:hidden}

table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 2px;border-bottom:1px solid var(--bd)}td.r{text-align:right;font-weight:700}

.search{position:relative}
.results{position:absolute;left:0;right:0;top:100%;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:10;max-height:320px;overflow:auto}

.seg{display:flex;background:#e6e6e9;border-radius:10px;padding:3px;margin-bottom:10px}

.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.checkout{position:fixed;left:0;right:0;bottom:64px;z-index:19;background:var(--gr);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.checkout .t{flex:1;line-height:1.15}.checkout .t small{color:#bbb;font-size:13px}.checkout .t b{display:block;font-size:24px;font-weight:800}
.checkout .btn{min-height:52px;font-size:16px;padding:0 18px}
.hero{background:var(--gr);color:#fff;border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.hero small{color:#bbb;font-weight:600;font-size:13px}.hero b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
.delta{font-size:13px;font-weight:700}.delta.up{color:#4fd18b}.delta.dn{color:#ff7b7b}.kpi .delta.up{color:var(--ok)}.kpi .delta.dn{color:var(--bad)}
.prog{height:12px;background:#e6e6e9;border-radius:6px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--or);border-radius:6px}
.prog i.done{background:var(--ok)}
details.gl summary{cursor:pointer;font-weight:700;padding:4px 0}details.gl dt{font-weight:700;margin-top:8px}details.gl dd{margin:2px 0 0;color:var(--mu);font-size:14px}
.th{width:40px;height:40px;flex:none;border-radius:8px;object-fit:cover;background:#f1f1f3;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:18px;color:#aaa;overflow:hidden}
.th.sm{width:34px;height:34px;font-size:15px}.th.lg{width:84px;height:84px;font-size:30px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:8px}
.ptile{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:left;cursor:pointer;font:inherit;color:var(--tx);display:flex;flex-direction:column;gap:4px;min-height:44px}
.ptile:active{transform:scale(.97)}.ptile img,.ptile .ph{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:30px}
.ptile .pn{font-size:13px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.ptile .pp{font-weight:800;font-size:15px}.ptile .ps{font-size:11px;color:var(--mu)}.ptile .ps.low{color:var(--bad);font-weight:700}
hr{border:0;border-top:1px solid var(--bd);margin:12px 0}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="icon-192.png" alt=""><div><b>MAIA</b> <span>CONSTRUÇÃO</span><small id="sub">Sistema da loja</small></div></div>
  <button id="lockBtn" class="ghost" data-act="lock" title="Bloquear" hidden>🔒</button>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-act="tab" data-tab="inicio"><i>📊</i>Início</button>
  <button data-act="tab" data-tab="produtos"><i>📦</i>Produtos</button>
  <button data-act="tab" data-tab="vender" class="sell"><i>🛒</i>Vender</button>
  <button data-act="tab" data-tab="orcamento" class="sell orc"><i>📝</i>Orçamento</button>
  <button data-act="tab" data-tab="financeiro"><i>💰</i>Financeiro</button>
  <button data-act="tab" data-tab="mais"><i>⚙️</i>Mais</button>
</nav>
<div id="modal" class="modal" hidden><div class="sheet" id="mBody"></div></div>
<div id="scan" class="scan" hidden>
  <div id="reader"></div>
  <div class="scanbar"><div id="scanInfo">Aponte para o código de barras</div><button class="btn" data-act="scanStop">Concluir</button></div>
</div>
<div id="toast"></div>

<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const fmt=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=v=>(isFinite(v)?v:0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const num=s=>{ if(typeof s==='number') return s; s=String(s??'').trim().replace(/\s|R\$/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; };
const r2=n=>Math.round((+n||0)*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+(typeof f==='function'?f(x):(+x[f]||0)),0);
const dstr=d=>{ d=new Date(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dbr=s=>{ const [y,m,d]=String(s).slice(0,10).split('-'); return d+'/'+m+'/'+y; };
const dtbr=iso=>new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function toast(m,ms=2200){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms); }
function beep(){ try{ const a=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)()); const o=a.createOscillator(), g=a.createGain(); o.frequency.value=1500; o.connect(g); g.connect(a.destination); g.gain.value=.15; o.start(); o.stop(a.currentTime+.09);}catch(e){} }
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)&&loadScript.ok?.[src]) return res(); const s=document.createElement('script'); s.src=src; s.onload=()=>{(loadScript.ok??={})[src]=1;res()}; s.onerror=()=>rej(new Error('sem internet')); document.head.appendChild(s); }); }
const LIB_SCAN='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
const LIB_XLSX='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

/* ================= banco de dados (IndexedDB no aparelho) ================= */
const DB={ db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('maia-sistema',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this.db=r.result;res()}; r.onerror=()=>res(); }catch(e){res()} }); },
  get(k){ if(!this.db){ try{return Promise.resolve(JSON.parse(localStorage.getItem('maia_'+k)??'null')??undefined)}catch(e){return Promise.resolve()} }
    return new Promise(res=>{ const q=this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(); }); },
  set(k,v){ if(!this.db){ try{localStorage.setItem('maia_'+k,JSON.stringify(v))}catch(e){} return Promise.resolve(); }
    return new Promise(res=>{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').put(JSON.parse(JSON.stringify(v)),k); tx.oncomplete=res; tx.onerror=res; }); }
};
const S={ produtos:[], vendas:[], despesas:[], clientes:[], recebimentos:[], orcamentos:[], entradas:[], rascunho:null,
  config:{loja:'Maia Construção', pin:'', sheetsUrl:'', sheetsToken:'', autoSync:true, ultimaSync:'', estoqueNegativo:true, orcValidade:7, orcPixDesc:0, telefoneLoja:'', endereco:'', orcCondicoes:'Pagamento: Pix, dinheiro, débito ou crédito.\nEntrega: consulte o frete para sua região.\nRetirada na loja sem custo.'} };
const KEYS=['produtos','vendas','despesas','clientes','recebimentos','orcamentos','entradas','rascunho','config'];
async function load(){ await DB.open(); for(const k of KEYS){ const v=await DB.get(k); if(v!==undefined&&v!==null) S[k]= k==='config'?{...S.config,...v}:v; } }
function save(...keys){ keys.forEach(k=>DB.set(k,S[k])); nuvemSalvar(keys); if(keys.some(k=>k!=='config'&&k!=='rascunho')) scheduleSync(); }

const CATS=['Cimento e Argamassa','Hidráulica','Elétrica','Tintas','Piscinas - Químicos','Piscinas - Acessórios','Pingadeiras','Ferragens e Ferramentas','Acabamento','Outros'];
const DCATS=['Aluguel','Energia','Água','Internet/Telefone','Funcionários','Impostos','Frete','Embalagens','Manutenção','Marketing','Pró-labore','Outros'];
const PAGS=['Pix','Dinheiro','Débito','Crédito','Fiado'];
const prod=id=>S.produtos.find(p=>p.id===id);
const cli=id=>S.clientes.find(c=>c.id===id);

/* ================= estado da tela ================= */
const UI={ tab:'inicio', cmode:'venda', unlocked:false, periodo:'hoje', mes:dstr(new Date()).slice(0,7), pag:'', recebido:'',
  pq:'', pcat:'', fsub:'resumo', vq:'' };
const CST={venda:{cart:[],descExtra:'',cliente:''},orc:{cart:[],descExtra:'',cliente:''}};
['cart','descExtra','cliente'].forEach(k=>Object.defineProperty(UI,k,{get(){return CST[UI.cmode][k]},set(v){CST[UI.cmode][k]=v},enumerable:true}));
const PROTECTED=['inicio','financeiro','mais'];
const needPin=()=>S.config.pin && !UI.unlocked;

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  $('#lockBtn').hidden=!(S.config.pin&&UI.unlocked);
  $('#sub').textContent='Sistema da loja';
  const v=$('#view');
  UI.cmode=UI.tab==='orcamento'?'orc':'venda';
  $('#nav').hidden=N.ativo&&N.estado!=='ok';
  if(N.ativo&&N.estado!=='ok'){ v.innerHTML=nuvemTela(); return; }
  if(PROTECTED.includes(UI.tab)&&needPin()){ v.innerHTML=vLock(); setTimeout(()=>$('#pinIn')?.focus(),50); return; }
  v.innerHTML=({inicio:vInicio,vender:vVender,orcamento:vVender,entrada:vEntrada,produtos:vProdutos,financeiro:vFinanceiro,mais:vMais})[UI.tab]();
  after[UI.tab]?.();
}
const after={};

/* ================= NUVEM (Firebase) — um banco só para todos os aparelhos ================= */
const FB_CONFIG={apiKey:"AIzaSyB6geWc-iIvlm6QsnvfeQeFoq2rilygcmk",authDomain:"maiaconstrucaoo-9e7d0.firebaseapp.com",projectId:"maiaconstrucaoo-9e7d0",storageBucket:"maiaconstrucaoo-9e7d0.firebasestorage.app",messagingSenderId:"888230711810",appId:"1:888230711810:web:e1b663fff4134916db8d1b"};
const FB_V='10.12.2';
const NCOLS=['produtos','vendas','despesas','clientes','recebimentos','orcamentos','entradas'];
const N={ativo:true,f:null,auth:null,db:null,user:null,estado:'carregando',erro:'',cache:{},unsub:[],ok:false,renderPend:false};
const ORDEM={vendas:'data',orcamentos:'data',entradas:'data',recebimentos:'data',despesas:'data'};
const limpo=o=>JSON.parse(JSON.stringify(o));
async function nuvemCarregarSDK(){
  if(window.FB_MOCK) return window.FB_MOCK;
  const b=`https://www.gstatic.com/firebasejs/${FB_V}/`;
  const [A,U,F]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
  const app=A.initializeApp(FB_CONFIG); const auth=U.getAuth(app);
  let db; try{ db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }catch(e){ db=F.getFirestore(app); }
  return {
    auth, db,
    onUser:cb=>U.onAuthStateChanged(auth,cb),
    entrar:async()=>{ const p=new U.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'}); try{ await U.signInWithPopup(auth,p); }catch(e){ if(/popup|cancelled|blocked|operation-not-supported/.test(e.code||'')) await U.signInWithRedirect(auth,p); else throw e; } },
    redirectResult:()=>U.getRedirectResult(auth).catch(()=>null),
    sair:()=>U.signOut(auth),
    getMeta:async()=>{ const s=await F.getDoc(F.doc(db,'meta','info')); return s.exists()?s.data():null; },
    setMeta:d=>F.setDoc(F.doc(db,'meta','info'),d,{merge:true}),
    ouvirCol:(c,cb,err)=>F.onSnapshot(F.collection(db,c),{includeMetadataChanges:false},s=>cb(s.docs.map(d=>d.data()),s.metadata.hasPendingWrites,s.metadata.fromCache),err),
    ouvirConfig:(cb,err)=>F.onSnapshot(F.doc(db,'meta','config'),s=>cb(s.exists()?s.data():null,s.metadata.hasPendingWrites),err),
    salvarConfig:d=>F.setDoc(F.doc(db,'meta','config'),d),
    lote:async ops=>{ for(let i=0;i<ops.length;i+=400){ const w=F.writeBatch(db);
      ops.slice(i,i+400).forEach(o=>{ const r=F.doc(db,o.c,o.id); if(o.del) w.delete(r); else if(o.inc){ const d={...o.d}; for(const k in o.inc) d[k]=F.increment(o.inc[k]); w.set(r,d,{merge:true}); } else w.set(r,o.d); });
      await w.commit(); } }
  };
}
function nuvemTela(){ const st=N.estado;
  if(st==='carregando') return `<div class="lock card"><div style="font-size:40px">☁️</div><h2>Conectando…</h2><p class="mu">Carregando os dados da loja.</p></div>`;
  if(st==='negado') return `<div class="lock card"><div style="font-size:40px">⛔</div><h2>Acesso negado</h2><p class="mu">A conta <b>${esc(N.user?.email||'')}</b> não tem permissão neste sistema. Peça ao dono para liberar o seu e-mail.</p>${N.erro?`<p class="mu" style="font-size:12px">Código: ${esc(N.erro)}</p>`:''}<button class="btn big" style="margin-bottom:8px" onclick="location.reload()">Tentar de novo</button><button class="btn big light" onclick="nuvemSair()">Entrar com outra conta</button></div>`;
  if(st==='erro') return `<div class="lock card"><div style="font-size:40px">⚠️</div><h2>Sem conexão com a nuvem</h2><p class="mu">${esc(N.erro)}</p><button class="btn big" onclick="location.reload()">Tentar de novo</button></div>`;
  return `<div class="lock card"><img src="logo.png" alt="" style="width:170px;margin:4px auto 8px;display:block"><h2>Entrar no sistema</h2><p class="mu">Use a conta Google da loja. Os dados ficam na nuvem e aparecem iguais em todos os aparelhos.</p><button class="btn big" onclick="nuvemEntrar()">Entrar com Google</button>${N.erro?`<p class="neg" style="font-size:14px">${esc(N.erro)}</p>`:''}</div>`; }
async function nuvemEntrar(){ N.erro=''; try{ await N.f.entrar(); }catch(e){ N.erro='Não foi possível entrar: '+(e.code||e.message); render(); } }
async function nuvemSair(){ if(!confirm('Sair da conta neste aparelho?')) return; N.unsub.forEach(u=>u()); N.unsub=[]; await N.f.sair(); location.reload(); }
function dadosLocais(){ return NCOLS.reduce((t,c)=>t+(S[c]||[]).length,0); }
async function nuvemIniciar(){
  try{ N.f=await nuvemCarregarSDK(); }catch(e){ N.estado='erro'; N.erro='Precisa de internet na primeira vez para carregar o sistema da nuvem.'; render(); return; }
  N.f.redirectResult?.();
  N.f.onUser(async u=>{ N.user=u; N.unsub.forEach(x=>x()); N.unsub=[]; N.ok=false;
    if(!u){ N.estado='login'; render(); return; }
    N.estado='carregando'; render();
    let meta; try{ meta=await N.f.getMeta(); }catch(e){ if(/permission/.test(e.code||e.message)){ N.estado='negado'; N.erro=(e.code||'')+' (meta)'; render(); return; } N.estado='erro'; N.erro=e.message; render(); return; }
    if(!meta){
      const n=dadosLocais();
      if(n&&confirm(`A nuvem ainda está vazia.\n\nEste aparelho tem ${S.produtos.length} produtos, ${S.vendas.length} vendas e ${S.orcamentos.length} orçamentos.\n\nEnviar estes dados para a nuvem? Eles passam a ser os dados oficiais da loja em todos os aparelhos.\n\n(Faça isso no aparelho que está com os dados CERTOS.)`)){
        toast('Enviando dados para a nuvem…',4000);
        const ops=[]; NCOLS.forEach(c=>(S[c]||[]).forEach(x=>{ if(x&&x.id) ops.push({c,id:String(x.id),d:limpo(x)}); }));
        try{ await N.f.lote(ops); await N.f.salvarConfig(limpo(S.config)); }catch(e){ N.estado='erro'; N.erro='Falha ao enviar: '+e.message; render(); return; }
      } else if(n){ if(!confirm('Começar a nuvem VAZIA? Os dados deste aparelho não serão enviados.')){ N.estado='login'; await N.f.sair(); return; } }
      await N.f.setMeta({criado:new Date().toISOString(),por:u.email});
    } else if(dadosLocais()&&localStorage.getItem('maia_nuvem')!==meta.criado){
      try{ const d={app:'maia-sistema',versao:1,em:new Date().toISOString()}; KEYS.forEach(k=>d[k]=S[k]); await DB.set('backupAntesNuvem',d); }catch(e){}
    }
    try{ localStorage.setItem('maia_nuvem',meta?.criado||'1'); }catch(e){}
    NCOLS.forEach(c=>{ N.cache[c]=new Map(); });
    let chegou=0;
    NCOLS.forEach(c=>N.unsub.push(N.f.ouvirCol(c,(arr,pend)=>{
      const o=ORDEM[c]; if(o) arr.sort((a,b)=>String(a[o]).localeCompare(String(b[o])));
      S[c]=arr; N.cache[c]=new Map(arr.map(x=>[String(x.id),JSON.stringify(x)])); DB.set(c,arr);
      if(!N.ok&&++chegou>=NCOLS.length){ N.ok=true; N.estado='ok'; checarEntradas(); aplicarFotosRepo(); render(); }
      else if(N.ok&&!pend) nuvemRender();
    },e=>{ if(/permission/.test(e.code||'')){ N.estado='negado'; N.erro=(e.code||'')+' ('+c+')'; render(); } })));
    N.unsub.push(N.f.ouvirConfig((d,pend)=>{ if(d){ S.config={...S.config,...d}; DB.set('config',S.config); if(N.ok&&!pend) nuvemRender(); } }));
  });
}
function nuvemRender(){ const a=document.activeElement; const digitando=a&&a.closest&&a.closest('#view, #mBody')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(digitando||!$('#modal').hidden||!$('#scan').hidden){ N.renderPend=true; return; } N.renderPend=false; render(); }
document.addEventListener('focusout',()=>setTimeout(()=>{ if(N.renderPend) nuvemRender(); },300));
function nuvemSalvar(keys){ if(!N.ok) return; const ops=[];
  keys.forEach(c=>{ if(c==='config'){ N.f.salvarConfig(limpo(S.config)).catch(e=>toast('Erro ao salvar na nuvem: '+e.message)); return; }
    if(!NCOLS.includes(c)) return; const cache=N.cache[c]||new Map(); const vivos=new Set();
    (S[c]||[]).forEach(x=>{ if(!x||!x.id) return; const id=String(x.id); vivos.add(id); const j=JSON.stringify(x); const ant=cache.get(id); if(ant===j) return;
      const d=limpo(x); let inc=null;
      if(ant&&(c==='produtos'||c==='clientes')){ const k=c==='produtos'?'estoque':'saldo'; const old=JSON.parse(ant)[k]; if(typeof old==='number'&&typeof d[k]==='number'&&old!==d[k]){ inc={[k]:r2(d[k]-old)}; delete d[k]; } }
      ops.push(inc?{c,id,d,inc}:{c,id,d}); cache.set(id,j); });
    [...cache.keys()].forEach(id=>{ if(!vivos.has(id)){ ops.push({c,id,del:true}); cache.delete(id); } });
    N.cache[c]=cache; });
  if(ops.length) N.f.lote(ops).catch(e=>toast('Erro ao salvar na nuvem: '+(e.code||e.message),4000)); }

/* ================= períodos ================= */
function range(p){
  const n=new Date(); const t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==='hoje') return [t0,new Date(t0.getTime()+864e5)];
  if(p==='7d') return [new Date(t0.getTime()-6*864e5),new Date(t0.getTime()+864e5)];
  if(p==='30d') return [new Date(t0.getTime()-29*864e5),new Date(t0.getTime()+864e5)];
  if(p==='mes') return [new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,1)];
  if(p==='mesant') return [new Date(n.getFullYear(),n.getMonth()-1,1),new Date(n.getFullYear(),n.getMonth(),1)];
  if(p==='custom'){ const [y,m]=UI.mes.split('-').map(Number); return [new Date(y,m-1,1),new Date(y,m,1)]; }
  if(p==='ano') return [new Date(n.getFullYear(),0,1),new Date(n.getFullYear()+1,0,1)];
  return [new Date(2000,0,1),new Date(2100,0,1)];
}
const vendasEm=(a,b)=>S.vendas.filter(v=>v.status!=='cancelada'&&new Date(v.data)>=a&&new Date(v.data)<b);
const despesasEm=(a,b)=>{ const x=dstr(a), y=dstr(b); return S.despesas.filter(d=>d.data>=x&&d.data<y); };
function periodChips(){
  const opts=[['hoje','Hoje'],['7d','7 dias'],['mes','Este mês'],['mesant','Mês passado'],['ano','Ano'],['custom','Escolher mês']];
  return `<div class="chips">${opts.map(([k,l])=>`<button class="chip ${UI.periodo===k?'on':''}" data-act="periodo" data-p="${k}">${l}</button>`).join('')}</div>
  ${UI.periodo==='custom'?`<input type="month" value="${UI.mes}" onchange="UI.mes=this.value;render()" style="margin-top:6px">`:''}`;
}
function calc(a,b){
  const vs=vendasEm(a,b), ds=despesasEm(a,b);
  const fat=sum(vs,'total'), custo=sum(vs,'custoTotal'), desp=sum(ds,'valor');
  const cheio=sum(vs,v=>sum(v.itens,i=>(i.precoCheio??i.preco)*i.qtd)), descontos=cheio-fat;
  return {vs,ds,fat,custo,desp,bruto:fat-custo,liq:fat-custo-desp,descontos,n:vs.length,ticket:vs.length?fat/vs.length:0};
}

  <input id="pinIn" type="password" inputmode="numeric" maxlength="8" onkeydown="if(event.key==='Enter')unlock()"><br><br><button class="btn big" onclick="unlock()">Entrar</button></div>`; }

/* ================= TELA: início (dashboard) ================= */
function prevRange(p){ const [a,b]=range(p); const n=new Date();
  if(p==='mes'||p==='custom'||p==='mesant') return [new Date(a.getFullYear(),a.getMonth()-1,1),new Date(a.getFullYear(),a.getMonth(),1)];
  if(p==='ano') return [new Date(a.getFullYear()-1,0,1),new Date(a.getFullYear(),0,1)];
  const len=b-a; return [new Date(a-len),a]; }
function delta(cur,prev,label){ if(!prev) return cur?`<span class="delta up">novo</span>`:''; const d=(cur-prev)/Math.abs(prev)*100;
  return `<span class="delta ${d>=0?'up':'dn'}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))} <span style="opacity:.75;font-weight:500">${label}</span></span>`; }
const PREVLBL={hoje:'vs ontem','7d':'vs 7 dias antes',mes:'vs mês passado',mesant:'vs mês anterior',ano:'vs ano passado',custom:'vs mês anterior'};
function vInicio(){
  const [a,b]=range(UI.periodo); const c=calc(a,b); const [pa,pb]=prevRange(UI.periodo); const pc=calc(pa,pb); const lb=PREVLBL[UI.periodo];
  const margem=c.fat?c.bruto/c.fat*100:0;
  // mês atual: meta + ponto de equilíbrio
  const [ma,mb]=range('mes'); const mc=calc(ma,mb); const hoje=new Date(); const diasMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,0).getDate(); const dia=hoje.getDate();
  const projecao=dia?mc.fat/dia*diasMes:0; const meta=+S.config.metaMensal||0;

  const top=Object.values(agg).sort((x,y)=>y.f-x.f).slice(0,5);
  const low=S.produtos.filter(p=>p.ativo!==false&&(+p.estoque<=+p.estoqueMin)).sort((x,y)=>x.estoque-y.estoque);
  const aReceber=sum(S.clientes,'saldo');
  const alertas=[]; if(low.length) alertas.push(`📦 <b>${low.length}</b> produto(s) com estoque baixo`); if(aReceber>0) alertas.push(`💳 <b>${fmt(aReceber)}</b> a receber no fiado`);
  const parados=orcAbertos().filter(o=>diasDesde(o.data)>=2); if(parados.length) alertas.push(`📝 <b>${parados.length}</b> orçamento(s) sem resposta há 2+ dias (${fmt(sum(parados,'total'))}) — <a href="#" onclick="event.preventDefault();orcList('aberto')" style="color:var(--or2);font-weight:700">cobrar agora</a>`);
  const om=S.orcamentos.filter(o=>new Date(o.data)>=a&&new Date(o.data)<b); const oAp=om.filter(o=>o.status==='aprovado'); const oPer=om.filter(o=>o.status==='perdido'); const motivos={}; oPer.forEach(o=>motivos[o.motivo]=(motivos[o.motivo]||0)+1); const topMot=Object.entries(motivos).sort((x,y)=>y[1]-x[1])[0];
  if(mc.desp&&mc.fat<equilibrio) alertas.push(`⚖️ Faltam <b>${fmt(equilibrio-mc.fat)}</b> em vendas para cobrir as despesas do mês`);
  return `${entBanner()}<h2>Como está a loja</h2>${periodChips()}
  <div class="hero">
    <div><small>Faturamento</small><b>${fmt(c.fat)}</b>${delta(c.fat,pc.fat,lb)}</div>
    <div><small>Lucro líquido</small><b style="color:${c.liq>=0?'#4fd18b':'#ff7b7b'}">${fmt(c.liq)}</b>${delta(c.liq,pc.liq,lb)}</div>
  </div>
  <div class="grid" style="margin-top:8px">
    <div class="kpi"><small>Margem bruta</small><b>${pct(margem)}</b><span class="mu">${fmt(c.bruto)} de lucro bruto</span></div>
    <div class="kpi"><small>Despesas</small><b class="neg">${fmt(c.desp)}</b>${delta(c.desp,pc.desp,'')}</div>
    <div class="kpi"><small>Vendas</small><b>${c.n}</b>${delta(c.n,pc.n,'')}</div>
    <div class="kpi"><small>Ticket médio</small><b>${fmt(c.ticket)}</b>${delta(c.ticket,pc.ticket,'')}</div>
  </div>
  ${alertas.length?`<div class="card" style="margin-top:10px;border-left:4px solid var(--or)">${alertas.map(x=>`<div style="padding:4px 0">${x}</div>`).join('')}</div>`:''}
  <div class="card" style="margin-top:10px"><b>Este mês</b>
    ${meta?`<div class="row between" style="margin-top:6px"><span class="mu">Meta ${fmt(meta)}</span><b>${pct(mc.fat/meta*100)}</b></div><div class="prog"><i class="${mc.fat>=meta?'done':''}" style="width:${Math.min(100,mc.fat/meta*100)}%"></i></div>
      <div class="mu">No ritmo atual o mês fecha em <b style="color:${projecao>=meta?'var(--ok)':'var(--bad)'}">${fmt(projecao)}</b></div>`
      :`<div class="mu" style="margin-top:6px">Projeção do mês no ritmo atual: <b>${fmt(projecao)}</b>. <a href="#" data-act="tab" data-tab="mais" style="color:var(--or2)">Definir meta</a></div>`}

    <dt>Ponto de equilíbrio</dt><dd>Quanto precisa vender no mês para pagar as despesas: despesas do mês ÷ margem bruta.</dd>

/* ================= TELA: vender (PDV) ================= */
function unitPrice(c){ if(c.precoFix!=null) return +c.precoFix; if(!c.pid) return +c.preco; const p=prod(c.pid); if(!p) return +c.preco||0; return c.desc&&+p.precoDesc>0?+p.precoDesc:+p.preco; }
function cartTotals(){ const sub=r2(sum(UI.cart,c=>unitPrice(c)*c.qtd)); const dx=Math.min(num(UI.descExtra),sub); return {sub,dx,total:r2(sub-dx)}; }

  <button class="btn big ${isOrc?'dark':''}" data-act="scanSell" style="font-size:18px">📷 Escanear código de barras</button>

  <div class="card cart" style="margin-top:10px">
    <div class="row between"><b>Carrinho (${sum(UI.cart,'qtd')} itens)</b><span class="row"><button class="btn sm light" data-act="avulso">+ Avulso</button>${UI.cart.length?'<button class="btn sm light" data-act="clearCart">Limpar</button>':''}</span></div>
    ${UI.cart.length?UI.cart.map((c,i)=>{ const p=c.pid?prod(c.pid):null; const up=unitPrice(c); const hasD=p&&+p.precoDesc>0;
      return `<div class="ci"><div class="row between">${thumb(p,'sm')}<div class="grow"><div class="nm" style="font-weight:700">${esc(p?p.nome:c.nome)}</div>

function finalizar(){
  if(!UI.cart.length) return toast('Carrinho vazio');
  if(!UI.pag){ $('#pagLbl')?.scrollIntoView({behavior:'smooth',block:'center'}); return toast('Escolha a forma de pagamento'); }
  if(UI.pag==='Fiado'&&!UI.cliente) return toast('Selecione o cliente para venda fiado');
  const t=cartTotals();
  let recebido=t.total, troco=0;
  if(UI.pag==='Dinheiro'){ recebido=num(UI.recebido)||t.total; if(recebido<t.total) return toast('Valor recebido é menor que o total'); troco=r2(recebido-t.total); }
  const itens=UI.cart.map(c=>{ const p=c.pid?prod(c.pid):null; return {pid:c.pid||null,nome:p?p.nome:c.nome,codigo:p?.codigo||'',qtd:c.qtd,preco:unitPrice(c),precoCheio:p?+p.preco:+c.preco,custo:p?(+p.custo||0):(+c.custo||0),desc:!!c.desc}; });
  // rateio do desconto extra no lucro: entra no total
  const custoTotal=r2(sum(itens,i=>i.custo*i.qtd));
  const c=UI.cliente?cli(UI.cliente):null;
  const v={id:uid(),num:(S.vendas.reduce((m,x)=>Math.max(m,x.num||0),0)+1),data:new Date().toISOString(),itens,subtotal:t.sub,descontoExtra:t.dx,total:t.total,custoTotal,lucro:r2(t.total-custoTotal),pagamento:UI.pag,recebido,troco,clienteId:c?.id||'',clienteNome:c?.nome||'',status:'ok'};
  if(UI.orcId){ const o=orc(UI.orcId); if(o){ o.status='aprovado'; o.vendaId=v.id; o.aprovadoEm=v.data; v.orcamentoNum=o.num; } }
  S.vendas.push(v);
  itens.forEach(i=>{ const p=i.pid&&prod(i.pid); if(p) p.estoque=r2(+p.estoque-i.qtd); });
  if(UI.pag==='Fiado'&&c) c.saldo=r2((+c.saldo||0)+v.total);
  save('vendas','produtos','clientes','orcamentos');
  Object.assign(UI,{cart:[],pag:'',descExtra:'',recebido:'',cliente:'',vq:'',orcId:''});
  render(); recibo(v);
}

  if(o.obs){ cy+=2; d.setFont('helvetica','bold'); d.setTextColor(25); d.text('Observações',10,cy); d.setFont('helvetica','normal'); d.setTextColor(70); const ls=d.splitTextToSize(t(o.obs),bx-16); d.text(ls,10,cy+4.5); cy+=4.5+ls.length*4.3; }
  // chamada final
  let fy=Math.max(cy,yy+10)+8; if(fy>262){ d.addPage(); fy=20; }
  d.setDrawColor(240,120,25); d.setLineWidth(.6); d.roundedRect(10,fy,W-20,17,2,2,'S');
  d.setTextColor(25); d.setFont('helvetica','bold'); d.setFontSize(11); d.text('Gostou? Para aprovar, é só responder SIM no WhatsApp.',W/2,fy+7,{align:'center'});

  return d.output('blob');
}

function custoReal(compra,icms,frete){ return r2(num(compra)*(1+num(icms)/100)+num(frete)); }
function fotoArquivo(file){ return new Promise((res,rej)=>{ if(!file) return rej(); const img=new Image(); const u=URL.createObjectURL(file);
  img.onload=()=>{ const S2=200, c=document.createElement('canvas'); c.width=S2; c.height=S2; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,S2,S2);
    const k=Math.min(S2/img.width,S2/img.height); const w=img.width*k, h=img.height*k; g.drawImage(img,(S2-w)/2,(S2-h)/2,w,h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.72)); };
  img.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; img.src=u; }); }

function pfSugerir(){ const m=num($('#pf_mg').value), c=custoReal($('#pf_custo').value,$('#pf_icms').value,$('#pf_frete').value); if(!c||m<=0||m>=95) return toast('Preencha o custo e a margem (até 94%)'); $('#pf_preco').value=String(r2(c/(1-m/100))).replace('.',','); pfCalc(); }

function doEntrada(id){ const p=prod(id), q=num($('#en_q').value), c=num($('#en_c').value); if(q<=0) return toast('Quantidade inválida');
  if(c>0){ const cr=custoReal(c,p.icms,p.frete); p.custoCompra=c; p.custo = $('#en_med').checked && +p.estoque>0 ? r2((p.estoque*p.custo+q*cr)/(+p.estoque+q)) : cr; }
  p.estoque=r2(+p.estoque+q); save('produtos'); closeModal(); toast('Estoque atualizado: '+p.estoque); render(); }

let ENT_PEND=[];
async function checarEntradas(){ try{ const r=await fetch('entradas.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return; const j=await r.json();
  const feitas=S.config.entradasAplicadas||[]; const pend=(j.entradas||[]).filter(e=>!feitas.includes(e.id));
  const autos=pend.filter(e=>e.auto); ENT_PEND=pend.filter(e=>!e.auto);
  if(autos.length&&(!N.ativo||N.ok)){ autos.forEach(entAuto); save('produtos','entradas','config'); toast(`📥 Entrada automática: ${autos.map(e=>e.fornecedor).join(', ')} — ${sum(autos,e=>e.itens.length)} produtos`,5000); render(); return; }
  if(ENT_PEND.length&&['inicio','produtos'].includes(UI.tab)) render(); }catch(e){ console.log(e); } }
function entAuto(e){ const agora=new Date().toISOString(); const c4=v=>Math.round((+v||0)*10000)/10000;
  const daFoto=new Set(((S.entradas||[]).find(x=>x.id==='2026-11-20-piscina')?.itens||[]).map(i=>i.pid));
  const reg={id:e.id,data:agora,fornecedor:e.fornecedor||'',nota:e.nota||'',itens:[],total:0,auto:true};
  e.itens.forEach((i,k)=>{ const c=c4(i.custo), q=+i.qtd||0; let p=entAchar(i.codigo,i.nome);
    if(p&&(p.entradas||[]).includes(e.id)) return;
    if(!p){ const pv=+i.preco?+i.preco:(c&&i.mg?precoBonito(c/(1-i.mg/100)):0);
      p={id:'e-'+e.id+'-'+k,nome:i.nome,codigo:String(i.codigo||''),categoria:i.categoria||'',unidade:i.unidade||'un',custoCompra:c,icms:0,frete:0,custo:c,preco:pv,precoDesc:0,estoque:q,estoqueMin:Math.max(1,Math.round(q*0.2)),ativo:true,criado:agora,foto:fotoRepo(i.codigo,i.nome),entradas:[e.id]};
      S.produtos.push(p); }
    else { if(daFoto.has(p.id)){ p.estoque=Math.max(+p.estoque||0,q); p.custo=c; }
      else { p.custo=+p.estoque>0&&+p.custo>0?c4((p.estoque*p.custo+q*c)/(+p.estoque+q)):c; p.estoque=r2((+p.estoque||0)+q); }
      p.custoCompra=c; p.icms=p.icms||0; p.frete=p.frete||0; if(+i.preco) p.preco=+i.preco; else if(!+p.preco&&i.mg) p.preco=precoBonito(c/(1-i.mg/100)); if(!p.categoria) p.categoria=i.categoria||''; (p.entradas??=[]).push(e.id); }
    reg.itens.push({pid:p.id,nome:p.nome,qtd:q,custo:c,custoReal:c}); });
  reg.total=r2(sum(reg.itens,i=>i.qtd*i.custo)); (S.entradas??=[]).push(reg); (S.config.entradasAplicadas??=[]).push(e.id); }

function entAchar(cod,nome){ return S.produtos.find(p=>(cod&&String(p.codigo)===String(cod)))||(nome?S.produtos.find(p=>norm(p.nome)===norm(nome)):null); }
function entAddProduto(pid){ const p=prod(pid); const R=S.rascunho; const ex=R.itens.find(i=>i.pid===pid); if(ex){ toast('Já está na lista'); return; }
  R.itens.unshift({pid,nome:p.nome,codigo:p.codigo||'',categoria:p.categoria||'',unidade:p.unidade||'un',qtd:'',custo:'',preco:'',dica:''}); save('rascunho'); }

  if(it){ it.qtd=String(num(it.qtd)+1); save('rascunho'); $('#scanInfo').innerHTML=`✅ <b>${esc(it.nome||'Produto novo')}</b> — qtd ${it.qtd}`; return; }
  const p=S.produtos.find(p=>String(p.codigo)===code);
  R.itens.unshift(p?{pid:p.id,nome:p.nome,codigo:code,categoria:p.categoria||'',unidade:p.unidade||'un',qtd:'1',custo:'',preco:'',dica:''}:{pid:null,nome:'',codigo:code,categoria:'',unidade:'un',qtd:'1',custo:'',preco:'',dica:''});
  save('rascunho'); $('#scanInfo').innerHTML=p?`✅ <b>${esc(p.nome)}</b> adicionado`:`🆕 Código ${esc(code)} — produto novo, preencha o nome depois`; }
function entSet(i,k,v){ S.rascunho.itens[i][k]=v; save('rascunho'); if(['custo','preco','qtd'].includes(k)) entTotais(); }
function entCustoReal(i){ const R=S.rascunho; const c=num(i.custo); if(!c) return 0;
  const tot=sum(R.itens,x=>num(x.qtd)*num(x.custo)); const fr=num(R.frete); const fu=tot>0&&num(i.qtd)>0?fr*(c/tot):0;
  return custoReal(c,R.icms,fu); }
function entTotais(){ const R=S.rascunho; const el=$('#entTot'); if(el) el.innerHTML=`${R.itens.length} produtos · ${sum(R.itens,i=>num(i.qtd))} unidades · compra <b>${fmt(sum(R.itens,i=>num(i.qtd)*num(i.custo)))}</b>${num(R.frete)||num(R.icms)?` · custo real <b>${fmt(sum(R.itens,i=>num(i.qtd)*entCustoReal(i)))}</b>`:''}`;
  R.itens.forEach((it,i)=>{ const m=$('#entM'+i); if(m){ const c=num(it.custo),pv=num(it.preco)||(it.pid?+prod(it.pid)?.preco:0); const cr=entCustoReal(it); m.innerHTML=c?`custo real <b>${fmt(cr)}</b>/un${pv?` · margem <b class="${pv>cr?'pos':'neg'}">${pct((pv-cr)/pv*100)}</b>`:''}`:''; } }); }
function precoBonito(p){ if(p<1) return Math.ceil(p*20)/20; if(p<10) return Math.ceil(p*10)/10; const c=Math.ceil(p); return c-0.1>=p?r2(c-0.1):r2(c+0.9); }
function entAplicarMargem(){ const mg=num($('#entMg').value); if(mg<0||mg>=95) return toast('Margem até 94%'); S.rascunho.margem=mg?String(mg):''; let n=0;
  S.rascunho.itens.forEach(i=>{ const m=mg||num(i.mg); if(num(i.custo)>0&&!num(i.preco)&&m>0&&m<95){ i.preco=String(precoBonito(entCustoReal(i)/(1-m/100))).replace('.',','); n++; } }); save('rascunho'); render(); toast(n?`Preço sugerido em ${n} produto(s)`:'Preencha o custo primeiro'); }

function entBuscar(){ modal(`<div class="row between"><h2>Buscar produto cadastrado</h2><button class="ghost" onclick="closeModal()">✕</button></div><input id="eb_q" placeholder="Nome ou código" oninput="entBuscarR()" autocomplete="off"><div class="list" id="eb_r" style="margin-top:8px"></div>`); setTimeout(()=>$('#eb_q').focus(),50); }
function entBuscarR(){ const q=norm($('#eb_q').value).trim(); const r=q?S.produtos.filter(p=>norm(p.nome).includes(q)||String(p.codigo||'').includes(q)).slice(0,30):[];
  $('#eb_r').innerHTML=r.map(p=>`<div class="it" onclick="entAddProduto('${p.id}');closeModal();render()"><div class="grow"><div class="nm">${esc(p.nome)}</div><div class="mu">estoque ${p.estoque}</div></div></div>`).join('')||(q?'<div class="empty">Nada encontrado — use + Novo</div>':''); }
function entConfirmar(){ const R=S.rascunho; const its=R.itens;
  for(const [k,i] of its.entries()){ const nm=i.pid?prod(i.pid)?.nome:i.nome;
    if(!i.pid&&!String(i.nome).trim()) return toast(`Item ${k+1}: falta o nome`);
    if(num(i.qtd)<=0) return toast(`${nm||'Item '+(k+1)}: falta a quantidade`);
    if(!i.pid&&num(i.preco)<=0) return toast(`${nm}: falta o preço de venda`);
    if(i.codigo&&S.produtos.some(p=>String(p.codigo)===String(i.codigo)&&p.id!==i.pid)) return toast(`Código ${i.codigo} já é de outro produto`); }
  const semCusto=its.filter(i=>num(i.custo)<=0).length;
  if(semCusto&&!confirm(`${semCusto} produto(s) sem custo. Sem o custo o lucro desses itens não é calculado. Dar entrada assim mesmo?`)) return;
  const reg={id:R.id||uid(),data:new Date().toISOString(),fornecedor:R.fornecedor,nota:R.nota,itens:[],total:0};
  const crs=its.map(i=>entCustoReal(i)); const fr=num(R.frete), tot=sum(its,x=>num(x.qtd)*num(x.custo));
  its.forEach((i,k)=>{ const q=num(i.qtd), c=num(i.custo), cr=crs[k], pv=num(i.preco); let p=i.pid?prod(i.pid):null; const fu=tot>0&&c>0?r2(fr*(c/tot)):0;
    if(!p){ p={id:uid(),nome:i.nome.trim(),codigo:String(i.codigo||'').trim(),categoria:i.categoria||'',unidade:i.unidade||'un',custoCompra:c,icms:num(R.icms),frete:fu,custo:cr,preco:pv,precoDesc:0,estoque:0,estoqueMin:0,ativo:true,criado:reg.data,foto:i.foto||fotoRepo(i.codigo,i.nome)}; S.produtos.push(p); }
    else if(c>0){ p.custoCompra=c; p.icms=num(R.icms); p.frete=fu; p.custo=+p.estoque>0&&+p.custo>0?r2((p.estoque*p.custo+q*cr)/(+p.estoque+q)):cr; }
    if(pv>0) p.preco=pv; p.estoque=r2(+p.estoque+q);
    reg.itens.push({pid:p.id,nome:p.nome,qtd:q,custo:c,custoReal:cr}); });
  reg.frete=fr; reg.icms=num(R.icms);
  reg.total=r2(sum(reg.itens,i=>i.qtd*i.custo)); (S.entradas??=[]).push(reg);
  if(R.id){ (S.config.entradasAplicadas??=[]).push(R.id); ENT_PEND=ENT_PEND.filter(e=>e.id!==R.id); }
  S.rascunho={id:'',fornecedor:'',nota:'',margem:'',frete:'',icms:'',itens:[]};
  save('produtos','entradas','rascunho','config'); UI.tab='produtos'; render(); toast(`Entrada feita: ${reg.itens.length} produtos no estoque ✅`,3500); }

function vFinanceiro(){
  const seg=[['resumo','Resumo'],['vendas','Vendas'],['despesas','Despesas'],['fiado','Fiado']];
  let h=`<h2>Financeiro</h2><div class="seg">${seg.map(([k,l])=>`<button class="${UI.fsub===k?'on':''}" data-act="fsub" data-s="${k}">${l}</button>`).join('')}</div>`;
  if(UI.fsub==='fiado') return h+vFiado();
  h+=periodChips();
  const [a,b]=range(UI.periodo); const c=calc(a,b);
  if(UI.fsub==='resumo'){
    const porPag={}; c.vs.forEach(v=>porPag[v.pagamento]=(porPag[v.pagamento]||0)+v.total);
    const porCat={}; c.ds.forEach(d=>porCat[d.categoria]=(porCat[d.categoria]||0)+d.valor);
    const porPCat={}; c.vs.forEach(v=>v.itens.forEach(i=>{ const k=(i.pid&&prod(i.pid)?.categoria)||'Outros'; porPCat[k]??={f:0,l:0}; porPCat[k].f+=i.preco*i.qtd; porPCat[k].l+=(i.preco-i.custo)*i.qtd; }));
    h+=`<div class="card" style="margin-top:8px"><b>Demonstrativo de resultado</b><table style="margin-top:6px">
      <tr><td>Faturamento (vendas)</td><td class="r">${fmt(c.fat)}</td></tr>
      <tr><td class="mu">Descontos concedidos</td><td class="r mu">${fmt(c.descontos)}</td></tr>
      <tr><td>(−) Custo das mercadorias vendidas</td><td class="r neg">${fmt(-c.custo)}</td></tr>
      <tr><td><b>= Lucro bruto</b> <span class="mu">(${pct(c.fat?c.bruto/c.fat*100:0)})</span></td><td class="r">${fmt(c.bruto)}</td></tr>
      <tr><td>(−) Despesas</td><td class="r neg">${fmt(-c.desp)}</td></tr>
      <tr class="sum"><td>= Lucro líquido <span class="mu">(${pct(c.fat?c.liq/c.fat*100:0)})</span></td><td class="r ${c.liq>=0?'pos':'neg'}">${fmt(c.liq)}</td></tr></table></div>
    <div class="card"><b>Por forma de pagamento</b><table>${PAGS.map(p=>`<tr><td>${p}</td><td class="r">${fmt(porPag[p]||0)}</td></tr>`).join('')}</table></div>
    <div class="card"><b>Por setor</b><table>${Object.entries(porPCat).sort((x,y)=>y[1].f-x[1].f).map(([k,v])=>`<tr><td>${esc(k)}<div class="mu">lucro ${fmt(v.l)}</div></td><td class="r">${fmt(v.f)}</td></tr>`).join('')||'<tr><td class="mu">Sem vendas</td></tr>'}</table></div>
    <div class="card"><b>Despesas por categoria</b><table>${Object.entries(porCat).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${fmt(v)}</td></tr>`).join('')||'<tr><td class="mu">Sem despesas</td></tr>'}</table></div>
    <button class="btn big dark" data-act="xlsx">📗 Baixar planilha Excel completa</button>`;
  }
  if(UI.fsub==='vendas'){
    const all=S.vendas.filter(v=>new Date(v.data)>=a&&new Date(v.data)<b).slice().reverse();

function rowsAll(){
  return {
    Produtos:S.produtos.map(p=>({Nome:p.nome,Codigo:p.codigo,Categoria:p.categoria,Unidade:p.unidade,Custo_Compra:+(p.custoCompra??p.custo),ICMS_pct:+p.icms||0,Frete_un:+p.frete||0,Custo_Real:+p.custo,Preco_Venda:+p.preco,Preco_Desconto:+p.precoDesc||'',Margem_pct:+p.preco?r2((p.preco-p.custo)/p.preco*100):0,Estoque:+p.estoque,Estoque_Min:+p.estoqueMin,Valor_Estoque_Custo:r2(Math.max(0,p.estoque)*p.custo),Ativo:p.ativo!==false?'sim':'não'})),
    Vendas:S.vendas.map(v=>({Numero:v.num,Data:dtbr(v.data),Cliente:v.clienteNome,Pagamento:v.pagamento,Subtotal:v.subtotal,Desconto_Extra:v.descontoExtra,Total:v.total,Custo:v.custoTotal,Lucro:v.lucro,Status:v.status})),
    Itens_Vendidos:S.vendas.flatMap(v=>v.itens.map(i=>({Venda:v.num,Data:dtbr(v.data),Produto:i.nome,Codigo:i.codigo,Qtd:i.qtd,Preco_Unit:i.preco,Usou_Desconto:i.desc?'sim':'não',Custo_Unit:i.custo,Total:r2(i.preco*i.qtd),Lucro:r2((i.preco-i.custo)*i.qtd),Status:v.status}))),
    Despesas:S.despesas.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(d=>({Data:dbr(d.data),Descricao:d.descricao,Categoria:d.categoria,Valor:d.valor})),
    Clientes:S.clientes.map(c=>({Nome:c.nome,WhatsApp:c.telefone,Tipo:c.tipo,Saldo_Fiado:c.saldo,Obs:c.obs})),
    Orcamentos:S.orcamentos.map(o=>({Numero:o.num,Data:dtbr(o.data),Cliente:o.clienteNome,WhatsApp:o.clienteTel,Obra:o.ref,Itens:o.itens.length,Total:o.total,Lucro_Previsto:r2(o.total-(o.custoTotal||0)),Validade:dbr(o.validade),Status:orcStatus(o),Motivo_Perda:o.motivo||'',Follow_ups:(o.followups||[]).length})),
    Entradas:(S.entradas||[]).flatMap(e=>e.itens.map(i=>({Data:dtbr(e.data),Fornecedor:e.fornecedor,Nota:e.nota,Produto:i.nome,Qtd:i.qtd,Custo_Unit:i.custo,Total:r2(i.qtd*i.custo)}))),
    Resumo_Mensal:resumoMensal()
  };
}
function resumoMensal(){ const m={};
  S.vendas.filter(v=>v.status!=='cancelada').forEach(v=>{ const k=dstr(v.data).slice(0,7); m[k]??={f:0,c:0,d:0,n:0}; m[k].f+=v.total; m[k].c+=v.custoTotal; m[k].n++; });
  S.despesas.forEach(d=>{ const k=d.data.slice(0,7); m[k]??={f:0,c:0,d:0,n:0}; m[k].d+=d.valor; });
  return Object.keys(m).sort().map(k=>({Mes:k.slice(5)+'/'+k.slice(0,4),Vendas:m[k].n,Faturamento:r2(m[k].f),Custo_Mercadoria:r2(m[k].c),Lucro_Bruto:r2(m[k].f-m[k].c),Despesas:r2(m[k].d),Lucro_Liquido:r2(m[k].f-m[k].c-m[k].d)})); }
async function exportXlsx(){ try{ await loadScript(LIB_XLSX);}catch(e){ return toast('Precisa de internet para gerar o Excel'); }
  const wb=XLSX.utils.book_new(); const R=rowsAll();
  for(const [n,rows] of Object.entries(R)){ const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{}]); ws['!cols']=Object.keys(rows[0]||{}).map(k=>({wch:Math.max(10,k.length+2)})); XLSX.utils.book_append_sheet(wb,ws,n); }
  XLSX.writeFile(wb,`maia-construcao-${dstr(new Date())}.xlsx`); toast('Planilha gerada'); }
async function modeloXlsx(){ try{ await loadScript(LIB_XLSX);}catch(e){ return toast('Precisa de internet'); }
  const ws=XLSX.utils.json_to_sheet([{nome:'Cimento CP II 50kg',codigo:'7891234567890',categoria:'Cimento e Argamassa',unidade:'sc',custo:32.5,preco:42,preco_desconto:39.9,estoque:40,estoque_min:10},{nome:'Cloro granulado 10kg',codigo:'',categoria:'Piscinas - Químicos',unidade:'balde',custo:150,preco:229.9,preco_desconto:209.9,estoque:8,estoque_min:3}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Produtos'); XLSX.writeFile(wb,'modelo-produtos-maia.xlsx'); }
async function importProdutos(file){ if(!file) return; if(!canEdit()) return; try{ await loadScript(LIB_XLSX);}catch(e){ return toast('Precisa de internet'); }
  const wb=XLSX.read(await file.arrayBuffer()); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const g=(r,...ks)=>{ for(const k of Object.keys(r)){ const nk=norm(k).replace(/[^a-z]/g,''); if(ks.includes(nk)) return r[k]; } return ''; };
  let novos=0, at=0;
  rows.forEach(r=>{ const nome=String(g(r,'nome','produto','descricao')).trim(); if(!nome) return; const codigo=String(g(r,'codigo','codigodebarras','ean','codbarras')).trim();
    const d={nome,codigo,categoria:String(g(r,'categoria','setor')).trim(),unidade:String(g(r,'unidade','un')).trim()||'un',custo:num(g(r,'custo','precocusto')),preco:num(g(r,'preco','precovenda','venda')),precoDesc:num(g(r,'precodesconto','desconto','precodesc')),estoque:num(g(r,'estoque','quantidade','qtd')),estoqueMin:num(g(r,'estoquemin','minimo','estoqueminimo'))};
    const ex=S.produtos.find(p=>(codigo&&p.codigo===codigo)||norm(p.nome)===norm(nome));
    if(ex){ Object.assign(ex,d); at++; } else { S.produtos.push({id:uid(),ativo:true,criado:new Date().toISOString(),...d}); novos++; } });
  save('produtos'); toast(`${novos} novos, ${at} atualizados`,3500); render(); }
function baixarArquivo(nome,conteudo,tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); }
function backup(){ const d={app:'maia-sistema',versao:1,em:new Date().toISOString()}; KEYS.forEach(k=>d[k]=S[k]); baixarArquivo(`backup-maia-${dstr(new Date())}.json`,JSON.stringify(d),'application/json'); }
async function restaurar(file){ if(!file) return; try{ const d=JSON.parse(await file.text()); if(d.app!=='maia-sistema') throw 0; if(!confirm('Substituir TODOS os dados da loja (em todos os aparelhos) pelo backup?')) return;
  KEYS.forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; }); save(...KEYS.filter(k=>k!=='rascunho')); toast('Backup restaurado'); render(); }catch(e){ toast('Arquivo de backup inválido'); } }

let syncT=null;
function scheduleSync(){ if(!S.config.autoSync||!S.config.sheetsUrl) return; clearTimeout(syncT); syncT=setTimeout(()=>pushSheets(true),6000); }
async function pushSheets(silent){ const c=S.config; if(!c.sheetsUrl){ if(!silent) toast('Configure o link primeiro'); return; }
  try{ const data={}; KEYS.filter(k=>k!=='config').forEach(k=>data[k]=S[k]);
    const r=await fetch(c.sheetsUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.sheetsToken,action:'push',data,loja:c.loja})});
    const j=await r.json(); if(!j.ok) throw new Error(j.erro||'erro');
    c.ultimaSync=new Date().toISOString(); DB.set('config',c); if(!silent) toast('Dados enviados para a planilha ✅'); const i=$('#syncInfo'); if(i) i.textContent='Última sincronização: '+dtbr(c.ultimaSync);
  }catch(e){ if(!silent) toast('Falha ao sincronizar: '+e.message,3500); } }
async function pullSheets(){ const c=S.config; if(!c.sheetsUrl) return toast('Configure o link primeiro');
  if(!confirm('Baixar os dados da planilha e SUBSTITUIR os deste aparelho?')) return;
  try{ const r=await fetch(c.sheetsUrl+'?action=pull&token='+encodeURIComponent(c.sheetsToken)); const j=await r.json(); if(!j.ok) throw new Error(j.erro||'erro'); if(!j.data) throw new Error('planilha ainda vazia');
    KEYS.filter(k=>k!=='config').forEach(k=>{ if(j.data[k]) S[k]=j.data[k]; DB.set(k,S[k]); }); toast('Dados baixados ✅'); render();
  }catch(e){ toast('Falha: '+e.message,3500); } }

/* ================= leitor de código de barras ================= */
let scanner=null, scanMode='', scanCb=null, lastCode='', lastT=0;
async function scanStart(mode,cb){
  if(!window.isSecureContext) return toast('A câmera só funciona com o site em https',3500);
  try{ await loadScript(LIB_SCAN); }catch(e){ return toast('Sem internet para carregar o leitor'); }
  scanMode=mode; scanCb=cb; lastCode=''; $('#scan').hidden=false; $('#scanInfo').textContent=mode==='single'?'Aponte para o código de barras':'Aponte para os produtos — cada leitura entra no carrinho';
  const F=Html5QrcodeSupportedFormats;
  scanner=new Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.CODABAR,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  try{ await scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.85,380)),height:Math.floor(Math.min(h*.3,170))})},onScan,()=>{}); }
  catch(e){ await scanStop(); toast('Não foi possível abrir a câmera. Libere a permissão.',3500); }
}
function onScan(code){ const t=Date.now(); if(code===lastCode&&t-lastT<1800) return; lastCode=code; lastT=t; beep(); try{navigator.vibrate(60)}catch(e){}
  if(scanMode==='single'){ scanStop().then(()=>scanCb(code)); } else scanCb(code); }
async function scanStop(){ $('#scan').hidden=true; if(scanner){ const s=scanner; scanner=null; try{ await s.stop(); s.clear(); }catch(e){} } if(['vender','orcamento','entrada'].includes(UI.tab)&&$('#modal').hidden) render(); }

/* ================= modal ================= */
function modal(h){ $('#mBody').innerHTML=h; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; $('#mBody').innerHTML=''; }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

/* ================= ações ================= */
const ACT={
  tab:el=>{ UI.tab=el.dataset.tab; window.scrollTo(0,0); render(); },
  lock:()=>{ UI.unlocked=false; UI.tab='vender'; render(); },
  periodo:el=>{ UI.periodo=el.dataset.p; render(); },
  scanSell:()=>scanStart('multi',addByCode),
  scanFind:()=>scanStart('single',code=>{ const p=S.produtos.find(p=>String(p.codigo)===code); if(p) openProd(p.id); else if(confirm('Código '+code+' não cadastrado. Cadastrar?')) openProd(null,{codigo:code}); }),
  addPid:el=>{ addCart(el.dataset.id); UI.vq=''; render(); },
  cadCode:el=>{ const v=el.dataset.code; openProd(null,/^\d{6,}$/.test(v)?{codigo:v}:{nome:v},true); },
  qty:el=>{ const c=UI.cart[+el.dataset.i]; c.qtd=r2(c.qtd+ +el.dataset.d); if(c.qtd<=0) UI.cart.splice(+el.dataset.i,1); render(); },
  togDesc:el=>{ const c=UI.cart[+el.dataset.i]; c.desc=!c.desc; render(); },
  rmItem:el=>{ UI.cart.splice(+el.dataset.i,1); render(); },
  clearCart:()=>{ if(confirm('Limpar carrinho?')){ UI.cart=[]; UI.descExtra=''; if(UI.cmode==='orc') UI.orcEdit=''; else UI.orcId=''; render(); } },
  pag:el=>{ UI.pag=el.dataset.p; render(); },
  finalizar:()=>{ const t=cartTotals(); if(!S.config.estoqueNegativo){ const f=UI.cart.find(c=>c.pid&&+prod(c.pid).estoque<c.qtd); if(f) return toast('Estoque insuficiente: '+prod(f.pid).nome); } finalizar(); },
  avulso:()=>modal(`<h2>Item avulso</h2><p class="mu">Para algo sem cadastro (ex.: frete, serviço, areia por lata).</p><label>Descrição</label><input id="av_n"><div class="grid"><div><label>Preço (R$)</label><input id="av_p" inputmode="decimal"></div><div><label>Custo (R$)</label><input id="av_c" inputmode="decimal" placeholder="0"></div></div><label>Quantidade</label><input id="av_q" inputmode="decimal" value="1"><br><br><button class="btn big" onclick="const n=$('#av_n').value.trim(),p=num($('#av_p').value);if(!n||!p)return toast('Preencha descrição e preço');UI.cart.push({pid:null,nome:n,preco:p,custo:num($('#av_c').value),qtd:num($('#av_q').value)||1});closeModal();render()">Adicionar</button>`),
  novoCliPdv:()=>openCli(null,true),
  newProd:()=>openProd(null),
  editProd:el=>openProd(el.dataset.id),
  pcat:el=>{ UI.pcat=el.dataset.c; render(); },
  fsub:el=>{ UI.fsub=el.dataset.s; render(); },
  verVenda:el=>verVenda(el.dataset.id),
  novaDesp:()=>openDesp(null), editDesp:el=>openDesp(el.dataset.id),
  receber:el=>receber(el.dataset.id),
  novoCli:()=>openCli(null), editCli:el=>openCli(el.dataset.id),
  xlsx:()=>exportXlsx(), modeloXlsx:()=>modeloXlsx(), backup:()=>backup(),
  saveSheets:()=>{ Object.assign(S.config,{sheetsUrl:$('#cf_url').value.trim(),sheetsToken:$('#cf_tok').value.trim(),autoSync:$('#cf_auto').checked}); save('config'); toast('Configuração salva'); },
  pushNow:()=>{ ACT.saveSheets(); pushSheets(false); }, pullNow:()=>{ ACT.saveSheets(); pullSheets(); },
  saveCfg:()=>{ Object.assign(S.config,{icmsPadrao:num($('#cf_icms').value),telefoneLoja:$('#cf_tel').value.trim(),endereco:$('#cf_end').value.trim(),orcValidade:Math.max(1,num($('#cf_val').value)||7),orcPixDesc:Math.max(0,Math.min(30,num($('#cf_pix').value))),orcCondicoes:$('#cf_cond').value,metaMensal:num($('#cf_meta').value),loja:$('#cf_loja').value.trim()||'Maia Construção',pin:$('#cf_pin').value.trim(),estoqueNegativo:$('#cf_neg').checked}); if(S.config.pin) UI.unlocked=true; save('config'); toast('Salvo'); render(); },
  wipe:()=>{ if(prompt('ATENÇÃO: apaga os dados da loja em TODOS os aparelhos.\nDigite APAGAR para confirmar')!=='APAGAR') return; const ks=['produtos','vendas','despesas','clientes','recebimentos','orcamentos','entradas']; ks.forEach(k=>{S[k]=[];}); save(...ks); toast('Dados apagados'); render(); },
  scanStop:()=>scanStop()
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=ACT[el.dataset.act]; if(f){ e.preventDefault(); f(el,e); } });
document.addEventListener('click',e=>{ if(!e.target.closest('.search')){ const r=$('#pdvRes'); if(r) r.innerHTML=''; } });

/* ================= início ================= */
(async()=>{ await load(); UI.tab=S.config.pin?'vender':'inicio'; render(); nuvemIniciar();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ r.update(); setInterval(()=>r.update(),30*60*1000); }).catch(()=>{}); let rl=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!rl&&navigator.serviceWorker.controller){ rl=true; if(!UI.cart.length&&$('#modal').hidden) location.reload(); } }); }
  try{ navigator.storage?.persist?.(); }catch(e){}
})();
